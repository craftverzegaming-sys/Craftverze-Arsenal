name: Build Mod

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Generate gradlew if missing and Build
      run: |
        cd WeaponCustom
        if [ ! -f "./gradlew" ]; then
          echo "gradlew missing, setting up Gradle..."
          wget -q https://services.gradle.org/distributions/gradle-8.8-bin.zip
          unzip -q gradle-8.8-bin.zip
          export PATH=$PWD/gradle-8.8/bin:$PATH
          gradle wrapper
        fi
        chmod +x ./gradlew
        ./gradlew build -Dorg.gradle.java.home="$JAVA_HOME"

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: mod-jar
        path: WeaponCustom/build/libs/*.jar
