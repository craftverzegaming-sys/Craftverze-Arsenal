name: Build Mod

on: [push, pull_request]

jobs:
  build:
  # Using windows-latest or ubuntu-latest works fine, but let's target ubuntu with Java 21
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Grant execute permission for gradlew
      run: chmod +x WeaponCustom/gradlew

    - name: Build with Gradle
      run: cd WeaponCustom && ./gradlew build

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: mod-jar
        path: WeaponCustom/build/libs/*.jar
